# cargo-about configuration for THIRD-PARTY-NOTICES.txt, the copyright and
# license notices of the Rust crates compiled into the shipped executable.
# Every package generates it when it is built, with packaging/notices.py.

# The platforms we ship, as in deny.toml (packaging/test_notices.py checks).
# Every package lists the crates of all of them: the file is then the same
# everywhere, and each clarification below is in the graph it is checked
# against (cargo-about warns about one that is not).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# The licenses deny.toml allows (packaging/test_notices.py keeps the two lists
# the same), in order of preference: a crate offered under several is listed
# under the first one here it accepts. MIT comes first, as it asks only that
# the copyright and permission notice be kept.
accepted = [
    "MIT",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Tests and benchmarks are not shipped.
ignore-dev-dependencies = true
# RAWmakase's own crates (all publish = false); LICENSE ships beside the notices.
private = { ignore = true }

# The crates below include their license text in a form cargo-about does not
# recognise, or only at the root of their repository. Each file is pinned by
# its SHA-256, so a changed license fails generation (cargo-about only warns;
# packaging/notices.py fails on any warning) instead of falling back to the
# license's generic text: check the new text, then update the checksum.
# A crate published with no license file at all is listed with the generic
# text and the authors its manifest names.

# eframe and egui, from the fork that [patch.crates-io] in Cargo.toml selects.
# Its license files are at the root of the repository, two levels up.
[ecolor.clarify]
license = "MIT OR Apache-2.0"
files = [
    { path = "../../LICENSE-MIT", license = "MIT", checksum = "95ca92f5f8ea5231f1580b3a2a799e8260af3114b900e1def5355a7f44bcf60c" },
    { path = "../../LICENSE-APACHE", license = "Apache-2.0", checksum = "8173d5c29b4f956d532781d2b86e4e30f83e6b7878dce18c919451d6ba707c90" },
]

